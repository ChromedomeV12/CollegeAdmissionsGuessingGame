<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admissions Oracle</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

<!-- Tabler icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />

<!-- Tailwind Play CDN: utilities only — preflight off so semantic CSS stays authoritative -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if (window.tailwind) {
    window.tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            night: {
              bg: "#1a1b26", fg: "#c0caf5", comment: "#565f89",
              red: "#f7768e", green: "#9ece6a", yellow: "#e0af68",
              blue: "#7aa2f7", magenta: "#bb9af7", cyan: "#7dcfff"
            },
            day: {
              bg: "#e1e2e7", fg: "#343b58", comment: "#848cb5",
              red: "#f52a65", green: "#587539", yellow: "#8c6c3e",
              blue: "#2e7de9", magenta: "#9854f1", cyan: "#00719c"
            }
          }
        }
      }
    };
  }
</script>

<link rel="stylesheet" href="styles-v2.css" />
</head>
<body>

<!-- Ambient wave backdrop: purely decorative, scroll-responsive via ambient-waves.js.
     Sits behind #root; if the script is blocked the layers rest at their default transform. -->
<div class="ambient-waves" aria-hidden="true">
  <svg class="aw-a" viewBox="0 0 1200 600" preserveAspectRatio="none" focusable="false">
    <defs>
      <linearGradient id="aw-grad-a" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".9" />
        <stop offset=".55" stop-color="var(--accent-magenta)" stop-opacity=".5" />
        <stop offset="1" stop-color="var(--accent-magenta)" stop-opacity="0" />
      </linearGradient>
    </defs>
    <path fill="url(#aw-grad-a)" d="M-40,240 C220,80 420,420 680,260 C880,140 1040,340 1240,200 L1240,600 L-40,600 Z" />
  </svg>
  <svg class="aw-b" viewBox="0 0 1200 640" preserveAspectRatio="none" focusable="false">
    <defs>
      <linearGradient id="aw-grad-b" x1="1" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--text-info)" stop-opacity=".85" />
        <stop offset=".6" stop-color="var(--accent)" stop-opacity=".45" />
        <stop offset="1" stop-color="var(--accent)" stop-opacity="0" />
      </linearGradient>
    </defs>
    <path fill="url(#aw-grad-b)" d="M-40,520 C240,360 460,620 720,460 C900,350 1080,520 1240,420 L1240,640 L-40,640 Z" />
  </svg>
  <svg class="aw-c" viewBox="0 0 1000 480" preserveAspectRatio="none" focusable="false">
    <defs>
      <linearGradient id="aw-grad-c" x1="0" y1="0" x2=".4" y2="1">
        <stop offset="0" stop-color="var(--accent-magenta)" stop-opacity=".8" />
        <stop offset=".7" stop-color="var(--text-info)" stop-opacity=".35" />
        <stop offset="1" stop-color="var(--text-info)" stop-opacity="0" />
      </linearGradient>
    </defs>
    <path fill="url(#aw-grad-c)" d="M-40,150 C180,40 380,300 620,170 C780,90 900,220 1040,130 L1040,0 L-40,0 Z" />
  </svg>
</div>
<script src="ambient-waves.js"></script>

<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Data + tier tables (plain JS, attached to window) -->
<script src="tiers.js"></script>
<script src="scoring.js"></script>
<script src="ranks.js"></script>

<!-- Components (Babel JSX) -->
<script type="text/babel" src="ui-primitives.jsx"></script>
<script type="text/babel" src="phase1-profile.jsx"></script>
<script type="text/babel" src="phase2-tier.jsx"></script>
<script type="text/babel" src="phase3-school.jsx"></script>
<script type="text/babel" src="phase4-results.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="submission.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
