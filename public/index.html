<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admissions Oracle</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

<!-- Tabler icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />

<style>
  /* ============================================================
     Admissions Oracle — design tokens (refined dark scheme)
     One confident accent: premium gold. Semantic: emerald/amber/coral.
     ============================================================ */
  :root {
    /* — Surfaces (dark, slight cool cast) — */
    --bg-canvas:        oklch(0.165 0.012 264);
    --bg-canvas-2:      oklch(0.195 0.014 264);
    --bg-surface:       oklch(0.225 0.016 264);
    --bg-surface-2:     oklch(0.270 0.018 264);
    --bg-surface-3:     oklch(0.315 0.020 264);
    --bg-ink:           oklch(0.130 0.010 264);

    /* — Text — */
    --text-primary:     oklch(0.965 0.008 80);
    --text-secondary:   oklch(0.805 0.012 264);
    --text-tertiary:    oklch(0.680 0.014 264);
    --text-danger:      oklch(0.810 0.158 25);
    --text-info:        oklch(0.810 0.118 210);
    --text-warning:     oklch(0.830 0.132 70);

    /* — Borders (translucent hairlines read better on dark) — */
    --border-1:         oklch(1 0 0 / 0.08);
    --border-2:         oklch(1 0 0 / 0.14);
    --border-ink:       oklch(0.965 0.008 80 / 0.20);
    --border-light:     oklch(1 0 0 / 0.06);
    --border-danger:    oklch(0.810 0.158 25 / 0.38);

    /* — Accent: premium gold (brand seal) — */
    --accent:           oklch(0.820 0.125 84);
    --accent-fg:        oklch(0.300 0.060 84);
    --accent-bg:        oklch(0.820 0.125 84 / 0.14);
    --accent-bd:        oklch(0.820 0.125 84 / 0.48);
    --stamp:            var(--accent);

    /* — Semantic: info (teal, selection/teaching) — */
    --accent-info-bg:   oklch(0.700 0.105 210 / 0.16);
    --accent-info-fg:   oklch(0.820 0.115 210);
    --accent-info-bd:   oklch(0.700 0.105 210 / 0.45);

    /* — Semantic: success (emerald, correct) — */
    --accent-ok-bg:     oklch(0.720 0.130 155 / 0.16);
    --accent-ok-fg:     oklch(0.820 0.150 155);
    --accent-ok-bd:     oklch(0.720 0.130 155 / 0.45);

    /* — Semantic: warn (amber-orange, missed admits) — */
    --accent-warn-bg:   oklch(0.750 0.140 58 / 0.16);
    --accent-warn-fg:   oklch(0.830 0.135 62);

    /* — Semantic: danger (coral red, wrong/penalty) — */
    --accent-danger-bg: oklch(0.700 0.170 25 / 0.16);
    --accent-danger-fg: oklch(0.810 0.158 25);

    /* — Misc semantic surfaces referenced inline — */
    --bg-danger:        oklch(0.700 0.170 25 / 0.14);
    --bg-info-subtle:   oklch(0.700 0.105 210 / 0.14);
    --bg-primary:       var(--bg-surface-2);   /* auth active toggle (raised dark) */
    --bg-secondary:     var(--bg-surface);     /* auth toggle track (inset dark) */

    /* — Radius scale — */
    --r-sm:   6px;
    --r-md:   10px;
    --r-lg:   14px;
    --r-pill: 999px;
    --radius-md: var(--r-md);   /* compat alias used by auth.jsx */

    /* — Spacing scale — */
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
    --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

    /* — Elevation — */
    --shadow-1: 0 1px 2px oklch(0 0 0 / 0.30);
    --shadow-2: 0 2px 6px -2px oklch(0 0 0 / 0.40), 0 1px 2px oklch(0 0 0 / 0.30);
    --shadow-3: 0 10px 28px -12px oklch(0 0 0 / 0.60), 0 2px 6px -2px oklch(0 0 0 / 0.42);
    --shadow-glow: 0 0 0 1px var(--accent-bd) inset, 0 10px 26px -14px oklch(0.820 0.125 84 / 0.40);

    /* — Focus ring — */
    --focus-ring: 0 0 0 2px var(--bg-canvas), 0 0 0 4px var(--accent);

    /* — Type — */
    --font-sans:  "Geist", "Söhne", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --font-mono:  "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;

    --fs-xs: 11px; --fs-sm: 12px; --fs-base: 13px; --fs-md: 14px;
    --fs-lg: 16px; --fs-h2: 30px; --fs-display: 34px; --fs-score: 72px;

    --ease: cubic-bezier(.2, .7, .2, 1);
    --dur: 160ms;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    font-size: var(--fs-base);
    line-height: 1.55;
    color: var(--text-primary);
    background:
      radial-gradient(1100px 620px at 12% -12%, oklch(0.820 0.125 84 / 0.06) 0%, transparent 58%),
      radial-gradient(960px 540px at 112% 112%, oklch(0.700 0.105 210 / 0.07) 0%, transparent 55%),
      var(--bg-canvas);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* subtle grain overlay for depth */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(oklch(1 0 0 / 0.022) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: screen;
  }
  #root { position: relative; z-index: 1; }

  /* — Base form controls (auth.jsx inputs are unclassed) — */
  input, select, textarea {
    font: inherit;
    font-size: var(--fs-base);
    color: var(--text-primary);
    background: var(--bg-surface-2);
    border: 1px solid var(--border-2);
    border-radius: var(--r-md);
    padding: 9px 12px;
    width: 100%;
    transition: border-color var(--dur) ease, box-shadow var(--dur) ease, background var(--dur) ease;
  }
  input::placeholder, textarea::placeholder { color: var(--text-tertiary); }
  input:hover, select:hover, textarea:hover { border-color: var(--border-ink); }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: var(--focus-ring);
  }
  label { cursor: default; }

  /* ============================================================
     Type primitives
     ============================================================ */
  .label {
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    font-weight: 500;
  }
  .num {
    font-feature-settings: "tnum";
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     Card
     ============================================================ */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    padding: var(--sp-4) var(--sp-5);
    box-shadow: var(--shadow-2);
    transition: border-color var(--dur) ease, box-shadow var(--dur) ease, transform var(--dur) ease;
  }
  .card--ink {
    background: var(--bg-ink);
    color: var(--text-primary);
    border-color: var(--border-1);
    box-shadow: var(--shadow-3);
  }
  .card--ink .label { color: var(--text-secondary); }

  /* ============================================================
     Pill (toggle button)
     ============================================================ */
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--border-2);
    border-radius: var(--r-pill);
    padding: 6px 16px;
    font-size: var(--fs-base);
    font-family: inherit;
    color: var(--text-secondary);
    background: var(--bg-surface);
    cursor: pointer;
    transition: background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease, box-shadow var(--dur) ease;
  }
  .pill:hover { background: var(--bg-surface-2); color: var(--text-primary); border-color: var(--border-ink); }
  .pill[aria-pressed="true"], .pill.is-active {
    border-color: var(--accent-info-bd);
    background: var(--accent-info-bg);
    color: var(--accent-info-fg);
  }
  .pill:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ============================================================
     Buttons — .btn / .btn--ghost (Btn component) and
     standalone .btn-primary / .btn-ghost (app.jsx, auth.jsx)
     ============================================================ */
  .btn, .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent);
    color: var(--accent-fg);
    border: 1px solid transparent;
    border-radius: var(--r-pill);
    padding: 10px 20px 10px 22px;
    font-size: var(--fs-base);
    font-weight: 600;
    letter-spacing: 0.01em;
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--shadow-2), 0 1px 0 oklch(1 0 0 / 0.18) inset;
    transition: transform var(--dur) ease, box-shadow var(--dur) ease, opacity var(--dur) ease, background var(--dur) ease;
  }
  .btn:hover, .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-3), 0 1px 0 oklch(1 0 0 / 0.22) inset;
  }
  .btn:active, .btn-primary:active { transform: translateY(0); }
  .btn:disabled, .btn-primary:disabled { opacity: 0.38; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ghost modifier (always combined with .btn, which supplies layout) */
  .btn--ghost {
    background: transparent;
    color: var(--text-primary);
    border-color: var(--border-2);
    box-shadow: none;
  }
  .btn--ghost:hover {
    background: var(--bg-surface-2);
    border-color: var(--border-ink);
    transform: none;
    box-shadow: none;
  }

  /* standalone ghost (no .btn base) — full layout */
  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-2);
    border-radius: var(--r-pill);
    padding: 8px 14px;
    font-size: var(--fs-base);
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease;
  }
  .btn-ghost:hover { background: var(--bg-surface-2); color: var(--text-primary); border-color: var(--border-ink); }
  .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ============================================================
     Badge
     ============================================================ */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 9px;
    border-radius: var(--r-pill);
    font-size: var(--fs-xs);
    font-weight: 500;
    line-height: 1.7;
    border: 1px solid var(--border-1);
    background: var(--bg-surface-2);
    color: var(--text-secondary);
  }
  .badge--info    { background: var(--accent-info-bg);   color: var(--accent-info-fg);   border-color: transparent; }
  .badge--ok      { background: var(--accent-ok-bg);     color: var(--accent-ok-fg);     border-color: transparent; }
  .badge--warn    { background: var(--accent-warn-bg);   color: var(--accent-warn-fg);   border-color: transparent; }
  .badge--danger  { background: var(--accent-danger-bg); color: var(--accent-danger-fg); border-color: transparent; }
  .badge--neutral { background: var(--bg-surface-2);     color: var(--text-secondary); }

  /* ============================================================
     Tabs
     ============================================================ */
  .tabs {
    display: flex; gap: 2px;
    border-bottom: 1px solid var(--border-1);
  }
  .tab {
    appearance: none; background: none; border: none;
    font-family: inherit; font-size: var(--fs-base);
    color: var(--text-secondary);
    padding: 10px 14px;
    cursor: pointer; position: relative;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color var(--dur) ease, border-color var(--dur) ease;
  }
  .tab:hover { color: var(--text-primary); }
  .tab[aria-selected="true"] {
    color: var(--text-primary);
    border-bottom-color: var(--accent);
    font-weight: 500;
  }

  /* ============================================================
     App scaffolding
     ============================================================ */
  .app-shell {
    max-width: 1040px;
    margin: 0 auto;
    padding: var(--sp-6) var(--sp-5) 96px;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-3);
    margin-bottom: var(--sp-2);
    padding-bottom: var(--sp-5);
    border-bottom: 1px solid var(--border-1);
  }
  .topbar + .stepper { margin-top: var(--sp-5); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    position: relative;
    background: var(--bg-surface);
    box-shadow: var(--shadow-1);
    flex-shrink: 0;
  }
  .brand-mark::before {
    content: "";
    position: absolute; inset: 4px;
    border-radius: 50%;
    border: 1px solid var(--accent-bd);
  }
  .brand-mark::after {
    content: "";
    position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 3.5px var(--accent);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1; gap: 2px; }
  .brand h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.015em;
  }
  .brand h1 em { font-style: italic; color: var(--accent); }
  .brand .brand-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }

  .phase-meta {
    display: flex; gap: var(--sp-3); align-items: center;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .phase-meta .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--border-ink);
    display: inline-block;
  }

  /* ============================================================
     Stepper
     ============================================================ */
  .stepper {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    margin: 0 0 var(--sp-6) 0;
    border: 1px solid var(--border-1);
    border-radius: var(--r-pill);
    overflow: hidden;
    background: var(--bg-surface);
    box-shadow: var(--shadow-1);
  }
  .stepper .step {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 10px 16px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    border-right: 1px solid var(--border-1);
    position: relative;
    transition: background var(--dur) ease, color var(--dur) ease;
  }
  .stepper .step:last-child { border-right: none; }
  .stepper .step .n {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--bg-surface-3);
    color: var(--text-tertiary);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600;
  }
  .stepper .step.done { color: var(--text-secondary); background: var(--bg-surface-2); }
  .stepper .step.done .n { background: var(--accent-ok-fg); color: oklch(0.16 0.02 155); }
  .stepper .step.current {
    color: var(--text-primary);
    background: var(--bg-surface-2);
  }
  .stepper .step.current .n { background: var(--accent); color: var(--accent-fg); }

  /* ============================================================
     Section header
     ============================================================ */
  .section-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 0 0 var(--sp-4);
    gap: var(--sp-5);
  }
  .section-head .title-block { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .section-head h2 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: var(--fs-h2);
    margin: 0;
    letter-spacing: -0.015em;
    line-height: 1.05;
  }
  .section-head .eyebrow {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .section-head .sub {
    color: var(--text-tertiary);
    font-size: var(--fs-base);
    font-family: var(--font-mono);
  }

  /* ============================================================
     Metric
     ============================================================ */
  .metric { display: flex; flex-direction: column; gap: 6px; }
  .metric .v {
    font-size: 26px;
    line-height: 1.05;
    font-weight: 500;
    letter-spacing: -0.01em;
    font-feature-settings: "tnum";
  }
  .metric .v .sub { color: var(--text-tertiary); font-weight: 400; font-size: 14px; }
  .metric .k { font-size: var(--fs-sm); color: var(--text-tertiary); }

  /* ============================================================
     Grid helpers
     ============================================================ */
  .grid { display: grid; gap: var(--sp-3); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }

  /* ============================================================
     Definition list (demographics)
     ============================================================ */
  .deflist {
    display: grid;
    grid-template-columns: 160px 1fr;
    row-gap: var(--sp-2);
    column-gap: var(--sp-4);
  }
  .deflist dt { color: var(--text-tertiary); font-size: var(--fs-base); }
  .deflist dd { margin: 0; font-size: var(--fs-base); color: var(--text-primary); }

  /* ============================================================
     Course history table
     ============================================================ */
  .course-table { width: 100%; border-collapse: collapse; font-size: var(--fs-base); }
  .course-table th, .course-table td {
    text-align: left; padding: 8px 10px; vertical-align: top;
  }
  .course-table thead th {
    font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); font-weight: 500;
    border-bottom: 1px solid var(--border-1);
  }
  .course-table tbody tr + tr td { border-top: 1px solid var(--border-1); }
  .course-table tbody tr:hover td { background: var(--bg-surface-2); }
  .course-table .year-cell {
    font-family: var(--font-mono); color: var(--text-tertiary);
    width: 56px;
  }

  /* ============================================================
     AP chart bars
     ============================================================ */
  .ap-row {
    display: grid; grid-template-columns: 1fr 64px 30px;
    align-items: center; gap: 10px;
    padding: 5px 0;
  }
  .ap-row .name { font-size: var(--fs-base); }
  .ap-row .bar-track {
    height: 8px;
    background: var(--bg-surface-3);
    border-radius: var(--r-sm);
    position: relative; overflow: hidden;
  }
  .ap-row .bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: var(--r-sm);
    transition: width 600ms var(--ease);
  }
  .ap-row .score-cell {
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
    text-align: right;
    color: var(--text-secondary);
  }
  .ap-row.pending .name { color: var(--text-tertiary); font-style: italic; }
  .ap-row.pending .bar-fill { background: var(--border-2); width: 100%; opacity: 0.6; }

  /* ============================================================
     Donut
     ============================================================ */
  .donut-wrap { display: flex; gap: var(--sp-5); align-items: center; flex-wrap: wrap; }
  .donut { width: 140px; height: 140px; }
  .donut-legend { display: flex; flex-direction: column; gap: var(--sp-2); font-size: var(--fs-base); }
  .donut-legend .sw {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; margin-right: 8px; vertical-align: middle;
  }

  /* ============================================================
     EC list
     ============================================================ */
  .ec-item {
    display: grid; grid-template-columns: 32px 1fr auto; gap: var(--sp-3);
    align-items: start; padding: 14px 0;
    border-top: 1px solid var(--border-1);
  }
  .ec-item:first-child { border-top: none; }
  .ec-item .num {
    font-family: var(--font-mono); color: var(--text-tertiary);
    font-size: var(--fs-base); padding-top: 1px;
  }
  .ec-item .title { font-weight: 500; font-size: var(--fs-md); }
  .ec-item .desc { font-size: var(--fs-base); color: var(--text-secondary); margin-top: 3px; }
  .ec-item ul {
    margin: var(--sp-2) 0 0; padding-left: 16px;
    color: var(--text-secondary); font-size: var(--fs-base);
  }
  .ec-item ul li { margin: 2px 0; }

  /* ============================================================
     Collapsible
     ============================================================ */
  .collapsible summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 10px 0; user-select: none;
    color: var(--text-secondary); font-size: var(--fs-base);
    transition: color var(--dur) ease;
  }
  .collapsible summary::-webkit-details-marker { display: none; }
  .collapsible summary:hover { color: var(--text-primary); }
  .collapsible[open] summary { color: var(--text-primary); }
  .collapsible summary .chev { transition: transform 200ms var(--ease); }
  .collapsible[open] summary .chev { transform: rotate(180deg); }
  .collapsible .body {
    padding: 4px 0 var(--sp-3);
    color: var(--text-secondary); font-size: var(--fs-base);
  }

  /* ============================================================
     School card
     ============================================================ */
  .school-card {
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
    padding: 13px 14px;
    background: var(--bg-surface);
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    transition: transform var(--dur) ease, background var(--dur) ease,
                border-color var(--dur) ease, box-shadow var(--dur) ease;
    position: relative;
  }
  .school-card:hover {
    background: var(--bg-surface-2);
    transform: translateY(-1px);
    border-color: var(--border-2);
    box-shadow: var(--shadow-2);
  }
  .school-card.is-selected {
    background: var(--accent-ok-bg);
    border-color: var(--accent-ok-bd);
    color: var(--accent-ok-fg);
    box-shadow: 0 0 0 1px var(--accent-ok-bd) inset, var(--shadow-2);
  }
  .school-card .name { font-size: var(--fs-base); font-weight: 500; }
  .school-card .check {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid var(--border-ink);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; background: var(--bg-surface-2);
    flex-shrink: 0; transition: background var(--dur) ease, border-color var(--dur) ease;
  }
  .school-card.is-selected .check {
    background: var(--accent-ok-fg);
    border-color: var(--accent-ok-fg);
    color: oklch(0.16 0.02 155);
  }

  /* ============================================================
     Result row
     ============================================================ */
  .result-row {
    display: grid; grid-template-columns: 28px 1fr auto auto;
    gap: var(--sp-3); align-items: center;
    padding: 10px 0;
    border-top: 1px solid var(--border-1);
    font-size: var(--fs-base);
  }
  .result-row:first-child { border-top: none; }
  .result-row .ico {
    width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: var(--fs-base);
  }
  .result-row .ico.ok   { background: var(--accent-ok-bg);     color: var(--accent-ok-fg); }
  .result-row .ico.bad  { background: var(--accent-danger-bg); color: var(--accent-danger-fg); }
  .result-row .ico.mid  { background: var(--bg-surface-3);     color: var(--text-tertiary); }
  .result-row .ico.miss { background: var(--accent-warn-bg);   color: var(--accent-warn-fg); }
  .result-row .delta {
    font-family: var(--font-mono); font-size: var(--fs-sm);
    color: var(--text-tertiary);
  }
  .result-row .delta.plus  { color: var(--accent-ok-fg); }
  .result-row .delta.minus { color: var(--accent-danger-fg); }

  /* ============================================================
     Callout
     ============================================================ */
  .callout {
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
    padding: 12px 14px;
    font-size: var(--fs-base);
    color: var(--text-secondary);
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--bg-surface-2);
  }
  .callout i { margin-top: 2px; color: var(--text-tertiary); font-size: 16px; }
  .callout--teach {
    background: var(--accent-info-bg);
    color: var(--accent-info-fg);
    border-color: transparent;
  }
  .callout--teach i { color: var(--accent-info-fg); }

  /* ============================================================
     Final banner
     ============================================================ */
  .final-banner {
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    padding: 26px 24px;
    text-align: center;
    background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-surface-2) 100%);
    box-shadow: var(--shadow-3);
    position: relative; overflow: hidden;
  }
  .final-banner::before,
  .final-banner::after {
    content: ""; position: absolute; top: 50%;
    height: 1px; width: 60px; background: var(--accent-bd);
  }
  .final-banner::before { left: 24px; transform: translateY(-50%); }
  .final-banner::after  { right: 24px; transform: translateY(-50%); }
  .final-banner .label { display: block; margin-bottom: var(--sp-2); color: var(--accent); }
  .final-banner .school {
    font-family: var(--font-serif); font-size: var(--fs-display);
    letter-spacing: -0.015em; line-height: 1.1;
  }
  .final-banner .date {
    color: var(--text-tertiary); font-size: var(--fs-sm); margin-top: var(--sp-2);
    font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ============================================================
     Animations
     ============================================================ */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .fade-in { animation: fadeUp 380ms var(--ease) both; }
  .stagger > * { animation: fadeUp 380ms var(--ease) both; }
  .stagger > *:nth-child(1) { animation-delay: 40ms; }
  .stagger > *:nth-child(2) { animation-delay: 100ms; }
  .stagger > *:nth-child(3) { animation-delay: 160ms; }
  .stagger > *:nth-child(4) { animation-delay: 220ms; }
  .stagger > *:nth-child(5) { animation-delay: 280ms; }
  .stagger > *:nth-child(6) { animation-delay: 340ms; }

  /* score reveal pop */
  @keyframes scorePop {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: none; }
  }
  .score-pop {
    font-family: var(--font-serif);
    font-size: var(--fs-score);
    line-height: 1;
    letter-spacing: -0.025em;
    font-feature-settings: "tnum";
    animation: scorePop 460ms var(--ease) both;
  }

  /* ============================================================
     Segmented toggle
     ============================================================ */
  .seg {
    display: inline-flex; padding: 3px; gap: 0;
    background: var(--bg-surface-2);
    border: 1px solid var(--border-1);
    border-radius: var(--r-pill);
  }
  .seg button {
    appearance: none; border: none; background: transparent;
    padding: 5px 13px; font-size: var(--fs-sm); font-family: inherit;
    border-radius: var(--r-pill); cursor: pointer;
    color: var(--text-secondary);
    transition: background var(--dur) ease, color var(--dur) ease;
  }
  .seg button:hover { color: var(--text-primary); }
  .seg button[aria-pressed="true"] {
    background: var(--bg-surface);
    color: var(--text-primary);
    box-shadow: var(--shadow-1);
  }

  /* ============================================================
     Misc
     ============================================================ */
  hr.sep { border: none; border-top: 1px solid var(--border-1); margin: 18px 0; }

  .profile-collapsed-summary {
    display: flex; justify-content: space-between; align-items: center;
    gap: var(--sp-3);
    padding: 12px 16px;
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    background: var(--bg-surface);
    box-shadow: var(--shadow-1);
    margin-bottom: var(--sp-4);
  }
  .profile-collapsed-summary .who { font-family: var(--font-serif); font-size: 18px; }

  /* Stamp ornament — reveal seal (available; not yet referenced in JSX) */
  .stamp-mark {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 14px;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border-radius: 4px;
    transform: rotate(-3deg);
    opacity: 0.92;
  }

  /* ============================================================
     Tier pick card
     ============================================================ */
  .tier-pick {
    appearance: none; border: 1px solid var(--border-1);
    background: var(--bg-surface);
    border-radius: var(--r-md);
    padding: 14px 14px 12px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    font-family: inherit; cursor: pointer; text-align: left;
    color: var(--text-primary);
    transition: transform var(--dur) ease, border-color var(--dur) ease,
                background var(--dur) ease, box-shadow var(--dur) ease;
    position: relative;
  }
  .tier-pick:hover {
    transform: translateY(-2px);
    border-color: var(--border-ink);
    box-shadow: var(--shadow-3);
  }
  .tier-pick .tname {
    font-family: var(--font-serif);
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    line-height: 1.05;
  }
  .tier-pick .trange {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .tier-pick.is-active {
    background: var(--accent-bg);
    border-color: var(--accent-bd);
    box-shadow: var(--shadow-glow);
  }
  .tier-pick.is-active .tname { color: var(--text-primary); }
  .tier-pick.is-active .trange { color: var(--accent); }
  .tier-pick.is-active::after {
    content: ""; position: absolute; top: 10px; right: 10px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 2px var(--bg-surface);
  }

  /* ============================================================
     Generic utilities (new, ≤12)
     ============================================================ */
  .stack { display: flex; flex-direction: column; gap: var(--sp-3); }
  .row   { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .muted { color: var(--text-tertiary); }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: var(--r-pill);
    font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.02em;
    background: var(--bg-surface-2); color: var(--text-secondary);
    border: 1px solid var(--border-1);
  }
  .divider { border: none; border-top: 1px solid var(--border-1); margin: var(--sp-4) 0; }
  .surface {
    background: var(--bg-surface);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    padding: var(--sp-4);
  }
  .center { display: flex; align-items: center; justify-content: center; }
  .grow { flex: 1 1 0; min-width: 0; }
  .accent-text { color: var(--accent); }
  .elevated { box-shadow: var(--shadow-2); }
  .clamp-2 {
    display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 2; overflow: hidden;
  }
  .visually-hidden {
    position: absolute !important; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* ============================================================
     Focus-visible (keyboard accessibility)
     ============================================================ */
  :focus-visible { outline: none; }
  .btn:focus-visible, .btn-primary:focus-visible,
  .btn--ghost:focus-visible, .btn-ghost:focus-visible,
  .pill:focus-visible, .tab:focus-visible, .seg button:focus-visible,
  .tier-pick:focus-visible, .school-card:focus-visible,
  .collapsible summary:focus-visible, .stamp-mark:focus-visible,
  .chip:focus-visible {
    box-shadow: var(--focus-ring);
  }
  a:focus-visible { box-shadow: var(--focus-ring); border-radius: 3px; }

  /* ============================================================
     Responsive
     ============================================================ */
  @media (max-width: 768px) {
    .app-shell { padding: var(--sp-5) var(--sp-4) 80px; }
    .topbar { flex-wrap: wrap; gap: var(--sp-2); padding-bottom: var(--sp-4); }
    .section-head { flex-direction: column; align-items: flex-start; gap: var(--sp-2); }
    .section-head h2 { font-size: 26px; }
    .topbar + .stepper { margin-top: var(--sp-4); }
    .stepper { font-size: 10px; }
    .stepper .step { padding: 8px 10px; gap: 6px; }
    .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .score-pop { font-size: 56px; }
  }
  @media (max-width: 640px) {
    .app-shell { padding: var(--sp-4) var(--sp-3) 72px; }
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .deflist { grid-template-columns: 1fr; row-gap: 2px; }
    .deflist dt { margin-top: var(--sp-2); }
    .brand h1 { font-size: 22px; }
    .section-head h2 { font-size: 24px; }
    .stepper { grid-template-columns: repeat(4, 1fr); overflow-x: auto; }
    .stepper .step { padding: 8px 8px; }
    .stepper .step .n { width: 16px; height: 16px; font-size: 9px; }
    .final-banner .school { font-size: 28px; }
    .score-pop { font-size: 48px; }
  }

  /* ============================================================
     Reduced motion
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .fade-in, .stagger > *, .score-pop { animation: none !important; }
  }
</style>
