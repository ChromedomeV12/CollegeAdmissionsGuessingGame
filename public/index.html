<!-- Sculpted-fold backdrop: purely decorative, driven by ambient-waves.js.
     Sits behind #root. The Three.js canvas paints an opaque layered relief
     (broad organic fold boundaries with crest highlights and valley shadows)
     and becomes the visible wallpaper only after its first frame renders
     without error (data-wave-rendered). Until then the SVG fallback below
     shows the same design statically: six broad closed Bezier fold shapes
     whose crest-side gradients carry a soft highlight over a deep valley
     shadow — no contour lines, no grid. -->
<div class="ambient-waves" aria-hidden="true">
  <canvas id="ambient-wave-canvas" aria-hidden="true"></canvas>
  <svg class="aw-fallback" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" focusable="false">
    <defs>
      <!-- Each gradient runs valley -> crest along the fold's local shading
           direction: deep shadow anchor into the fold color, ending in a
           soft crest highlight. All stops derive from exact Tokyo anchors. -->
      <linearGradient id="aw-f1" x1="0" y1="1" x2="0.35" y2="0">
        <stop offset="0" stop-color="var(--bg-canvas-2)" stop-opacity=".9" />
        <stop offset=".55" stop-color="var(--accent-magenta)" stop-opacity=".16" />
        <stop offset="1" stop-color="var(--accent)" stop-opacity=".30" />
      </linearGradient>
      <linearGradient id="aw-f2" x1="0.1" y1="1" x2="0.55" y2="0">
        <stop offset="0" stop-color="var(--bg-canvas-2)" stop-opacity=".85" />
        <stop offset=".55" stop-color="var(--accent)" stop-opacity=".14" />
        <stop offset="1" stop-color="var(--text-info)" stop-opacity=".26" />
      </linearGradient>
      <linearGradient id="aw-f3" x1="0.2" y1="1" x2="0.7" y2="0.1">
        <stop offset="0" stop-color="var(--bg-canvas-2)" stop-opacity=".8" />
        <stop offset=".6" stop-color="var(--text-tertiary)" stop-opacity=".18" />
        <stop offset="1" stop-color="var(--accent-magenta)" stop-opacity=".24" />
      </linearGradient>
      <linearGradient id="aw-f4" x1="0.3" y1="1" x2="0.75" y2="0.15">
        <stop offset="0" stop-color="var(--bg-canvas-2)" stop-opacity=".75" />
        <stop offset=".6" stop-color="var(--accent)" stop-opacity=".12" />
        <stop offset="1" stop-color="var(--text-primary)" stop-opacity=".18" />
      </linearGradient>
      <linearGradient id="aw-f5" x1="0.4" y1="1" x2="0.85" y2="0.2">
        <stop offset="0" stop-color="var(--bg-canvas-2)" stop-opacity=".7" />
        <stop offset=".6" stop-color="var(--accent-magenta)" stop-opacity=".10" />
        <stop offset="1" stop-color="var(--text-info)" stop-opacity=".16" />
      </linearGradient>
      <linearGradient id="aw-f6" x1="0.5" y1="1" x2="0.95" y2="0.25">
        <stop offset="0" stop-color="var(--bg-canvas-2)" stop-opacity=".6" />
        <stop offset=".65" stop-color="var(--text-tertiary)" stop-opacity=".12" />
        <stop offset="1" stop-color="var(--accent)" stop-opacity=".14" />
      </linearGradient>
    </defs>
    <!-- Six broad overlapping closed folds sweeping lower-left to upper-right;
         each shape's bottom edge mirrors its top edge offset downward, so the
         shape itself is one sculpted band of cloth. -->
    <path d="M-120,690 C240,640 460,540 760,486 C1020,440 1180,330 1560,240
             L1560,-120 L-120,-120 Z" fill="url(#aw-f1)" />
    <path d="M-120,780 C260,726 480,620 780,566 C1040,522 1200,408 1560,320
             L1560,-120 L-120,-120 Z" fill="url(#aw-f2)" />
    <path d="M-120,860 C280,806 500,700 800,646 C1060,602 1220,486 1560,398
             L1560,-120 L-120,-120 Z" fill="url(#aw-f3)" />
    <path d="M-120,930 C300,876 520,770 820,716 C1080,672 1240,554 1560,466
             L1560,-120 L-120,-120 Z" fill="url(#aw-f4)" />
    <path d="M-120,995 C320,941 540,835 840,781 C1100,737 1260,617 1560,529
             L1560,-120 L-120,-120 Z" fill="url(#aw-f5)" />
    <path d="M-120,1055 C340,1001 560,895 860,841 C1120,797 1280,675 1560,587
             L1560,-120 L-120,-120 Z" fill="url(#aw-f6)" />
  </svg>
</div>
